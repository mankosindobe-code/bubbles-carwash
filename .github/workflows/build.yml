name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: flet build apk --verbose

      - name: Find APK - THE BACKUP PLAN
        run: |
          echo "=== LOOKING FOR APK ==="
          find build -name "*.apk"
          echo "=== ALL FILES IN BUILD ==="
          ls -R build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/**/*.apk
